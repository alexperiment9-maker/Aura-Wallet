<style>
@font-face{font-family:'Bangers';src:url(bangers.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Fredoka';font-weight:400;src:url(fredoka-400.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Fredoka';font-weight:500;src:url(fredoka-500.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Fredoka';font-weight:600;src:url(fredoka-600.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Fredoka';font-weight:700;src:url(fredoka-700.woff2) format('woff2');font-display:swap}
:root{--y:#FFD60A;--p:#FF5DA2;--c:#3DDCFF;--l:#B8F24A;--o:#FF8A3D;--v:#A78BFA;--m:#7CF5C8;--gold:#FFC83D;--ink:#111;--paper:#FFFDF5;--red:#FF3B3B;--green:#19C37D;
  --sh:4px 4px 0 var(--ink);--sh2:6px 6px 0 var(--ink);--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:#FFE66D;min-height:100vh;overscroll-behavior-y:none;overflow-x:hidden}
.bg{position:fixed;inset:-50vmax;z-index:-2;background:repeating-conic-gradient(from 0deg,#FFE66D 0 10deg,#FFD23F 10deg 20deg);animation:sun 90s linear infinite}
.bg2{position:fixed;inset:0;z-index:-1;background:radial-gradient(rgba(0,0,0,.13) 1.2px,transparent 1.3px) 0 0/10px 10px,radial-gradient(ellipse at 50% 120%,rgba(255,93,162,.35),transparent 60%)}
@keyframes sun{to{transform:rotate(360deg)}}
h1,h2,h3,.bang{font-family:'Bangers',cursive;letter-spacing:1px;font-weight:400;margin:0}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--top) + 10px) 14px calc(var(--bot) + 116px)}
/* header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ava{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);box-shadow:var(--sh);background:var(--m) center/cover;display:grid;place-items:center;font-size:32px;flex:none;animation:wob 3.4s ease-in-out infinite;cursor:pointer;overflow:hidden}
@keyframes wob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) scale(1.04)}}
.who{flex:1;min-width:0}
.who h1{font-size:28px;line-height:.95;color:#fff;-webkit-text-stroke:1.4px var(--ink);text-shadow:3px 3px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{margin-top:5px;height:14px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;position:relative;box-shadow:2px 2px 0 var(--ink)}
.xp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--p),var(--v));border-right:2px solid var(--ink);transition:width .8s cubic-bezier(.3,1.5,.5,1)}
.xp b{position:absolute;inset:0;font-size:10px;line-height:10px;text-align:center;font-weight:700}
.lvl{background:var(--ink);color:var(--y);border-radius:14px;padding:6px 9px;text-align:center;transform:rotate(4deg);box-shadow:3px 3px 0 var(--p);cursor:pointer}
.lvl b{font-family:'Bangers';font-size:24px;display:block;line-height:1}
.lvl small{font-size:10px;font-weight:600}
.gear{width:42px;height:42px;border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--ink);font-size:20px;display:grid;place-items:center;flex:none}
.chipsrow{display:flex;gap:8px;margin:-2px 0 14px;flex-wrap:wrap}
.pill{background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
/* cards & tiles */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:var(--sh2);padding:14px;margin-bottom:16px}
.card h2{font-size:24px;margin-bottom:8px}
.tl{transform:rotate(-.7deg)}.tr{transform:rotate(.7deg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tile{border:3px solid var(--ink);border-radius:16px;box-shadow:var(--sh);padding:10px 12px;position:relative;overflow:hidden}
.tile .lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.tile .val{font-family:'Bangers';font-size:32px;line-height:1.05;margin-top:2px;word-break:break-all}
.tile .hint{font-size:12px;font-weight:500;opacity:.85}
.tile .emo{position:absolute;right:8px;top:6px;font-size:22px}
.full{grid-column:1/-1}
.givetile{background:linear-gradient(135deg,#FFE27A,#FFC83D 45%,#FF9F1C);text-align:center;animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:4px 4px 0 var(--ink),0 0 0 rgba(255,200,61,0)}50%{box-shadow:4px 4px 0 var(--ink),0 0 26px rgba(255,170,0,.85)}}
.givetile .val{font-size:56px}
.bigsafe .val{font-size:44px}
.nag{background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:var(--sh);padding:12px;margin-bottom:16px;font-weight:600;display:flex;gap:10px;align-items:center}
.nag button{margin-left:auto;background:var(--y);border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-weight:700;box-shadow:2px 2px 0 var(--ink);flex:none}
/* bars */
.bud{margin:10px 0 14px}
.bud .top2{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:5px}
.bud .top2 .ce{width:34px;height:34px;border:2px solid var(--ink);border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.bud .top2 .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud .top2 small{font-weight:500;opacity:.7}
.track{height:20px;border:2.5px solid var(--ink);border-radius:999px;background:#eee;overflow:hidden;position:relative}
.track .fill{height:100%;border-right:2px solid var(--ink);transition:width .7s cubic-bezier(.3,1.6,.5,1)}
.track .pace{position:absolute;top:-2px;bottom:-2px;border-left:3px dashed var(--ink);opacity:.55}
.track .over{background:repeating-linear-gradient(45deg,var(--red) 0 8px,#ff7a7a 8px 16px)!important}
.bud .sub{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-top:3px;opacity:.85}
.grade{display:inline-grid;place-items:center;min-width:28px;height:28px;border:2.5px solid var(--ink);border-radius:8px;font-family:'Bangers';font-size:18px;box-shadow:2px 2px 0 var(--ink);flex:none;padding:0 4px}
.gS{background:var(--gold)}.gA{background:var(--l)}.gB{background:var(--m)}.gC{background:var(--c)}.gD{background:var(--o)}.gF{background:var(--red);color:#fff}.gN{background:#ddd}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(var(--bot) + 10px);z-index:20;pointer-events:none}
nav .bar{pointer-events:auto;max-width:540px;margin:0 auto;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--sh2);display:flex;align-items:center;justify-content:space-around;padding:6px}
nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;padding:4px 6px;border-radius:12px;min-width:54px}
nav button span{font-size:22px;line-height:1.1;transition:transform .2s}
nav button.on{background:var(--y);border:2px solid var(--ink)}
nav button.on span{transform:scale(1.2) rotate(-8deg)}
nav .plus{width:66px;height:66px;margin-top:-34px;border-radius:50%;background:var(--p);border:3px solid var(--ink);box-shadow:var(--sh);font-size:40px;font-weight:700;line-height:1;display:grid;place-items:center;animation:idle 7s ease-in-out infinite}
@keyframes idle{0%,86%,100%{transform:none}88%{transform:rotate(-18deg) scale(1.08)}91%{transform:rotate(16deg) scale(1.08)}94%{transform:rotate(-10deg)}97%{transform:rotate(6deg)}}
nav .plus.angry{background:var(--red);color:#fff;animation:angry .9s ease-in-out infinite}
@keyframes angry{0%,100%{transform:scale(1)}50%{transform:scale(1.14) rotate(8deg)}}
/* forms */
label.f{display:block;font-weight:700;font-size:13px;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.5px}
.inp{width:100%;border:3px solid var(--ink);border-radius:14px;padding:11px 12px;background:#fff;box-shadow:3px 3px 0 var(--ink);outline:none}
.inp:focus{background:#FFF8C9}
.inp.bad{background:#ffd6d6;animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.amt-inp{font-family:'Bangers';font-size:46px;text-align:center;letter-spacing:2px;padding:6px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2.5px solid var(--ink);border-radius:999px;padding:7px 12px;background:#fff;font-weight:600;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.chip.on{transform:translate(-1px,-1px) rotate(-2deg);box-shadow:4px 4px 0 var(--ink)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catbtn{border:3px solid var(--ink);border-radius:14px;padding:8px 2px;background:#fff;font-weight:700;font-size:11px;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.catbtn span{font-size:26px}
.catbtn em{font-style:normal;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.catbtn.on{transform:rotate(-3deg) scale(1.05);box-shadow:5px 5px 0 var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:var(--sh);margin-bottom:6px}
.seg button{border:none;padding:12px;font-family:'Bangers';font-size:24px;letter-spacing:1px;background:#fff}
.seg button+button{border-left:3px solid var(--ink)}
.seg button.on.sp{background:var(--p)}.seg button.on.gv{background:var(--gold)}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:none}.sugg::-webkit-scrollbar{display:none}
.sugg .chip{white-space:nowrap;font-size:13px;padding:5px 10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:3px solid var(--ink);border-radius:16px;padding:13px;font-weight:700;font-size:17px;box-shadow:var(--sh);background:var(--y);margin-top:12px;text-decoration:none;color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.p{background:var(--p)}.btn.c{background:var(--c)}.btn.l{background:var(--l)}.btn.w{background:#fff}.btn.r{background:var(--red);color:#fff}.btn.v{background:var(--v)}.btn.g{background:var(--gold)}.btn.m{background:var(--m)}
.btn.mega{font-family:'Bangers';font-size:28px;letter-spacing:1.5px;padding:14px}
.btn.sm{padding:9px;font-size:15px;margin-top:8px}
.photo-pick{border:3px dashed var(--ink);border-radius:14px;padding:12px;text-align:center;background:#fff;font-weight:600;position:relative}
.photo-pick input{position:absolute;inset:0;opacity:0;width:100%}
.photo-prev{position:relative;margin-top:8px}
.photo-prev img{width:100%;max-height:200px;object-fit:contain;border:3px solid var(--ink);border-radius:14px;background:#000}
.photo-prev button{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px 10px;font-weight:700}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.sw.on{outline:3px solid var(--ink);outline-offset:3px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{font-size:24px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px 0}
.emojis button.on{background:var(--y);transform:scale(1.1)}
/* sheet & modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border:3px solid var(--ink);border-bottom:none;border-radius:26px 26px 0 0;padding:16px 16px calc(var(--bot) + 20px);animation:up .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:60px;height:6px;border-radius:9px;background:var(--ink);margin:0 auto 10px}
.sheet h2{font-size:30px;text-align:center}
.modal-scrim{align-items:center;padding:20px}
.modal{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--sh2);padding:18px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:30px;text-align:center;margin-bottom:6px}
.modal p{text-align:center;margin:6px 0}
.mini{font-size:12px;opacity:.75;margin-top:6px}
/* lists */
.daygrp{margin-bottom:14px}
.dayhead{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--y);border-radius:12px 12px 0 0;padding:6px 12px;font-family:'Bangers';font-size:20px;letter-spacing:1px}
.dayhead small{font-family:'Fredoka';color:#fff;font-size:12px;font-weight:600}
.daybody{background:var(--paper);border:3px solid var(--ink);border-top:none;border-radius:0 0 14px 14px;box-shadow:var(--sh)}
.ent{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:2px dashed #bbb}
.ent:last-child{border-bottom:none}
.ent .ic{width:40px;height:40px;border:2px solid var(--ink);border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.ent .mid{flex:1;min-width:0}
.ent .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .mid small{font-size:12px;opacity:.75}
.ent .rt{text-align:right;font-weight:700;white-space:nowrap}
.ent.give .rt{color:#B7791F}
.tag{display:inline-block;font-size:10px;font-weight:700;border:1.5px solid var(--ink);border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:1px;background:var(--gold)}
.empty{text-align:center;padding:26px 12px}
.empty .e{font-size:60px;display:block;animation:wob 2s infinite}
.secthead{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px;gap:8px}
.secthead h2{font-size:32px;color:#fff;-webkit-text-stroke:1.3px var(--ink);text-shadow:3px 3px 0 var(--ink)}
/* POKE CARD */
.pkwrap{perspective:900px;margin:4px auto 18px;max-width:340px}
.pk{position:relative;aspect-ratio:63/88;border-radius:18px;padding:9px;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);transform-style:preserve-3d;transition:transform .15s ease-out;animation:floaty 5s ease-in-out infinite;
  background:var(--rb,linear-gradient(135deg,#ddd,#bbb))}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -6px}}
.pk .in{height:100%;border-radius:11px;border:2.5px solid var(--ink);padding:8px 9px;display:flex;flex-direction:column;gap:6px;background:var(--tb,#eee);position:relative;overflow:hidden}
.pk .hd{display:flex;align-items:center;gap:6px}
.pk .hd .nm{font-family:'Bangers';font-size:22px;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .hd .hp{font-family:'Bangers';font-size:24px;line-height:1;color:#c00;-webkit-text-stroke:.6px var(--ink)}
.pk .hd .hp small{font-size:12px;color:var(--ink);-webkit-text-stroke:0}
.pk .hd .ty{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.pk .art{flex:0 0 34%;border:3px solid var(--ink);border-radius:6px;background:radial-gradient(circle at 50% 60%,#fff 0 20%,transparent 60%),var(--ab,linear-gradient(135deg,#fff,#ddd));display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.pk .art .big{font-size:78px;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.35));animation:wob 4s ease-in-out infinite}
.pk .art img{width:62%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid var(--ink)}
.pk .art .rar{position:absolute;right:5px;bottom:4px;font-size:11px;font-weight:700;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px}
.pk .art .lv{position:absolute;left:5px;top:4px;font-family:'Bangers';font-size:16px;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:0 5px}
.pk .typeline{font-size:10px;font-weight:700;text-align:center;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);margin-top:-3px}
.pk .gv{border:2.5px solid var(--ink);border-radius:10px;background:linear-gradient(135deg,#FFF1A8,#FFC83D);padding:5px 8px;display:flex;align-items:center;gap:8px;box-shadow:2px 2px 0 var(--ink)}
.pk .gv .n{font-family:'Bangers';font-size:34px;line-height:1}
.pk .gv .t{flex:1;font-size:11px;font-weight:700;line-height:1.15}
.pk .gv .t b{display:block;font-family:'Bangers';font-size:17px;font-weight:400;letter-spacing:.5px}
.pk .st{display:grid;grid-template-columns:auto 1fr 26px;align-items:center;gap:5px;font-size:10px;font-weight:700}
.pk .st .tr2{height:9px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.pk .st .tr2 i{display:block;height:100%}
.pk .st b{text-align:right;font-family:'Bangers';font-size:15px;font-weight:400}
.pk .atk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-top:1.5px solid rgba(0,0,0,.25);padding-top:4px}
.pk .atk .an{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .atk .grade{min-width:22px;height:22px;font-size:14px;border-width:2px;box-shadow:1px 1px 0 var(--ink)}
.pk .ft{margin-top:auto;display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;border-top:1.5px solid rgba(0,0,0,.3);padding-top:4px;gap:6px}
.pk .ft span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk::after{content:"";position:absolute;inset:0;border-radius:15px;pointer-events:none;mix-blend-mode:color-dodge;opacity:var(--holo,0);
  background:repeating-linear-gradient(115deg,rgba(255,0,128,.45) 0%,rgba(255,200,0,.45) 6%,rgba(0,255,170,.45) 12%,rgba(0,140,255,.45) 18%,rgba(190,0,255,.45) 24%,rgba(255,0,128,.45) 30%);
  background-size:300% 300%;background-position:var(--mx,50%) var(--my,50%);transition:background-position .1s}
.pk::before{content:"";position:absolute;inset:0;border-radius:15px;pointer-events:none;z-index:2;background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.55),transparent 45%);opacity:.6;mix-blend-mode:overlay}
/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--ink);padding:8px 4px;text-align:center;font-size:11px;font-weight:700;line-height:1.15}
.bdg span{font-size:30px;display:block}
.bdg.lock{background:#ddd;filter:grayscale(1);opacity:.55}

function periodRange(p,ref=today()){
  if(p==='daily')return[ref,ref];
  if(p==='weekly'){const w=(pd(ref).getDay()+6)%7;const s=addDays(ref,-w);return[s,addDays(s,6)]}
  const ms=S.monthStart||1;const d=pd(ref);let y=d.getFullYear(),m=d.getMonth();if(d.getDate()<ms){m--;if(m<0){m=11;y--}}
  const s=new Date(y,m,Math.min(ms,dim(y,m)));let ny=y,nm=m+1;if(nm>11){nm=0;ny++}const n=new Date(ny,nm,Math.min(ms,dim(ny,nm)));n.setDate(n.getDate()-1);return[ymd(s),ymd(n)];
}
function dayFrac(d=new Date()){return clamp((d.getHours()+d.getMinutes()/60-7)/16,0.03,1)} // waking hours 7am-11pm
function elapsed(p){const[a,b]=periodRange(p);const len=diffDays(a,b)+1;const done=diffDays(a,today());return clamp((done+dayFrac())/len,0.01,1)}
function sumSpend(a,b,cat){let s=0;for(const e of E)if(e.type==='spend'&&e.date>=a&&e.date<=b&&(!cat||e.cat===cat))s+=e.amt;return s}
function sumGive(a,b){let s=0;for(const e of E)if(e.type==='give'&&e.date>=a&&e.date<=b)s+=e.amt;return s}
function budgetScore(u,t){if(u<=t)return 100;if(u<=1)return 100-(u-t)/Math.max(1-t,.0001)*40;return Math.max(0,60-(u-1)*120)}

/* =================== SCORES =================== */
function scopes(){ // all active budgets
  const out=[];
  for(const p of ['daily','weekly','monthly'])if(S.overall[p]>0){const[a,b]=periodRange(p);out.push({key:'all-'+p,label:(p==='daily'?"today's":p==='weekly'?"this week's":"this month's")+' total',short:{daily:'Daily total',weekly:'Weekly total',monthly:'Monthly total'}[p],p,a,b,budget:S.overall[p],spent:sumSpend(a,b)})}
  for(const c of S.cats)if(c.budget>0){const[a,b]=periodRange(c.period);out.push({key:'cat-'+c.id,cat:c,label:`${c.emoji} ${c.name} (${PERIOD_LBL[c.period]})`,short:c.name,p:c.period,a,b,budget:c.budget,spent:sumSpend(a,b,c.id)})}
  for(const s of out){s.u=s.spent/s.budget;s.t=elapsed(s.p);s.score=budgetScore(s.u,s.t)}
  return out;
}
function loggedDays(){return new Set(E.filter(e=>!e.rec).map(e=>e.date))}
function streak(){const d=loggedDays();let x=d.has(today())?today():addDays(today(),-1),n=0;while(d.has(x)){n++;x=addDays(x,-1)}return n}
function xpTotal(){let x=S.xpBonus||0;for(const e of E){x+=e.type==='spend'?(e.rec?0:10):e.type==='give'?30+(e.photo?20:0):15}x+=Object.keys(S.badges).length*50;return x}
function levelOf(x){const l=Math.floor(Math.sqrt(x/40))+1;return{l,cur:40*(l-1)**2,next:40*l**2}}
function calc(){
  const t=today(),a30=addDays(t,-29);
  const give30=sumGive(a30,t),spend30=sumSpend(a30,t);
  const base30=Math.max(S.income||0,spend30+give30);
  const ratio=base30>0?give30/base30:0;
  const ratioScore=100*(1-Math.exp(-ratio/0.06));
  let weeks=0;for(let w=0;w<4;w++){if(sumGive(addDays(t,-7*w-6),addDays(t,-7*w))>0)weeks++}
  const give=Math.round(0.8*ratioScore+0.2*weeks*25);
  const sc=scopes();const nDays=loggedDays().size,ready=nDays>=3;
  const disc=ready&&sc.length?Math.round(sc.reduce((s,x)=>s+x.score,0)/sc.length):null;
  const ld=loggedDays();let l14=0;for(let i=0;i<14;i++)if(ld.has(addDays(t,-i)))l14++;
  const stk=streak();const cons=Math.round(clamp(l14/14*70+Math.min(stk,14)/14*30));
  const[ma,mb]=periodRange('monthly');const spentM=sumSpend(ma,mb);const tm=elapsed('monthly');
  const ref=S.income>0?S.income:S.overall.monthly>0?S.overall.monthly:0;
  let frug=null;if(!ready){}else if(ref>0){const r=spentM/(ref*Math.max(tm,.03));frug=Math.round(clamp(100-Math.max(0,r-.6)*125))}else if(disc!=null)frug=disc;
  const D=disc??50,F=frug??50;
  const aura=ready?Math.round(10*(0.4*give+0.25*D+0.2*cons+0.15*F)):0;
  const xp=xpTotal();const lv=levelOf(xp);
  const stats={give,disc:D,cons,frug:F};
  let tk='npc',mx=-1;for(const k of ['give','disc','cons','frug'])if(stats[k]>mx){mx=stats[k];tk=k}if(mx<40||!ready)tk='npc';
  const rar=ready?RARITY.find(r=>aura>=r[0]):UNRANKED;
  // per category this month
  const catRows=S.cats.map(c=>{const sp=sumSpend(ma,mb,c.id);const s=sc.find(x=>x.key==='cat-'+c.id);return{c,spent:sp,score:s?Math.round(s.score):null,scope:s}}).sort((a,b)=>b.spent-a.spent);
  const atks=catRows.filter(r=>r.spent>0).slice(0,2).map(r=>({e:r.c.emoji,n:r.c.name+' '+ATK_VERBS[hash(r.c.name)%ATK_VERBS.length],g:gradeOf(r.score),dmg:r.spent}));
  const weak=!ready?null:sc.filter(x=>x.score<60).sort((a,b)=>a.score-b.score)[0];
  return{ready,nDays,give,disc,cons,frug,stats,aura,xp,lv,tk,rar,give30,spend30,base30,givePct:ratio*100,weeks,streak:stk,l14,sc,catRows,atks,weak,spentM,ma,mb};
}

  const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);return await new Promise(r=>cv.toBlob(r,'image/jpeg',q))}

let saving=false;
async function saveEntry(ev){
  if(saving)return;
  const amtEl=$('#fAmt');F.amt=amtEl.value;F.note=($('#fNote').value||'').trim().slice(0,80);F.date=$('#fDate').value;
  const amt=money(F.amt);
  if(!amt||amt<=0){amtEl.classList.add('bad');setTimeout(()=>amtEl.classList.remove('bad'),500);toast('Amount: missing. Vibes: off. 🙄','warn');buzz(80);return}
  if(amt>1e7&&!(await ask('That much? 🤨',`${inr(amt)}. Are we sure? Typos happen.`,'Yes, really','Fix it')))return;
  if(!validYmd(F.date)){toast('Pick a real date 📅','warn');return}
  if(F.date>today()){toast('Future spending? Time traveller? 🕰️ Pick today or earlier.','warn');return}
  if(F.type==='spend'&&!S.cats.some(c=>c.id===F.cat))F.cat='other';
  saving=true;
  try{
    const before=calc();const scBefore=before.sc;
    const old=E.find(e=>e.id===F.id);
    const rec={id:F.id,type:F.type,date:F.date,amt,note:F.note,created:F.created||Date.now(),time:old&&old.date===F.date?old.time:(F.date===today()?Date.now():pd(F.date).getTime()+12*36e5)};
    if(F.type==='spend')rec.cat=F.cat;else rec.cause=F.cause;
    if(F.photo)rec.photo=F.photo;
    await dbPut('entries',rec);urlCache.delete(rec.id);
    const i=E.findIndex(e=>e.id===rec.id);if(i>=0)E[i]=rec;else E.push(rec);
    const r=ev.target.getBoundingClientRect();closeSheet();
    if(F._edit){toast('Updated. Nobody saw that. ✅')}
    else if(rec.type==='give'){
      const after=calc();rain(['🫶','💛','✨','🌟'],34);boom('🫶');floater(`+${after.give-before.give>0?after.give-before.give+' GIVE':'30 XP'}`,innerWidth/2,innerHeight/2-40);
      toast(pick(giveLines()),'gold');
    }else{
      confetti(r.left+r.width/2,r.top);floater(`+10 XP`,r.left+r.width/2,r.top-10);
      reactSpend(rec,scBefore);
    }
    afterChange();
  }catch(err){console.error(err);toast('Save failed. Try again? 😬','warn')}
  finally{saving=false}
}
function reactSpend(rec,scBefore){
  if(rec.date!==today()&&!scopes().some(s=>rec.date>=s.a&&rec.date<=s.b)){toast(pick(spendLines()));return}
  const after=scopes();const TH=[2,1.5,1,.8,.5];let best=null;
  for(const s of after){if(!(rec.date>=s.a&&rec.date<=s.b))continue;if(s.cat&&s.cat.id!==rec.cat)continue;
    const b=scBefore.find(x=>x.key===s.key);const ub=b?b.spent/b.budget:0;const ua=s.spent/s.budget;
    for(const th of TH){if(ua>=th&&ub<th){const sev=th+(s.key==='all-daily'?.01:0);if(!best||sev>best.sev)best={s,th,sev};break}}}
  const now=new Date(),hr=now.getHours(),tm=timeStr(now);
  if(!best){
    if(vibe()==='goofy'&&rec.amt===67){boom('🤲');toast('SIX SEVEN 🤲🤲');return}
    if(vibe()==='goofy'&&rec.amt<=20){toast(LN_(`${inr(rec.amt)}. Logging crumbs now. Respect. 🫡`,`${inr(rec.amt)}. Chillar bhi likh raha hai. Respect. 🫡`));return}
    toast(pick(spendLines()));return}
  const L=best.s.label;
  if(vibe()!=='goofy'){const v=vibe(),over=best.th>=1,speed=over&&best.s.key==='all-daily'&&rec.date===today()&&hr<12;
    if(speed&&!S.badges.speedrun){S.badges.speedrun=today();saveS()}
    const M={chill:{speed:`budget gone by ${tm}. interesting.`,over:`${L}: over budget. it happens.`,b80:`80% of ${L} used. heads up.`,b50:`half of ${L} used.`},
      pookie:{speed:`whole day's budget gone by ${tm}?? 🥺 bestie... it's okay 💖`,over:`${L} budget went bye-bye 🥺 tomorrow we slay 💖`,b80:`80% of ${L} gone 🥺 careful cutie 💕`,b50:`half of ${L} gone, still cute 🌸`},
      chad:{speed:`Day's budget gone by ${tm}. Weak start. Finish strong.`,over:`${L} budget breached. No excuses. Regroup.`,b80:`80% of ${L} spent. Hold the line.`,b50:`Half of ${L} spent. Stay disciplined.`}}[v];
    if(over)rain(['💔']);toast(speed?M.speed:over?M.over:best.th>=.8?M.b80:M.b50,over?'warn':'');return}
  if(best.th>=2){quake();rain(['🤡','💀'],26);toast(LN_(`200% of ${L} budget. The budget is a suggestion now. 🤡`,`${L} budget ka 200%. Budget ab bas suggestion hai. 🤡`),'warn');return}
  if(best.th>=1.5){quake();rain('🌽',18);toast(LN_(`150% of ${L}. We are in debt to ourselves. Ohio-tier. 🌽`,`${L} ka 150%. Khud ke karzdaar ban gaye. Ohio-level. 🌽`),'warn');return}
  if(best.th>=1){
    if(best.s.key==='all-daily'&&rec.date===today()&&hr<12){
      if(!S.badges.speedrun){S.badges.speedrun=today();saveS();const b=BADGES.find(x=>x.id==='speedrun');queueCeleb(`<div style="text-align:center;font-size:90px">${b.e}</div><h2>Badge unlocked?</h2><p><b>${b.n}</b></p><p class="mini">${b.d}</p>`)}
      boom('🏃');rain(['💨','🏃','⏱️'],22);
      toast(hr<9?LN_(`${tm}. Whole day's budget: gone. Breakfast isn't even digested. Impressive. Concerning. 🫠`,`${tm}. Poore din ka budget: khatam. Nashta bhi hazam nahi hua. 🫠`):LN_(`Whole day's budget gone by ${tm}. Speedrun any%. World record. 🏃💨`,`${tm} tak poore din ka budget gaya. Speedrun. World record. 🏃💨`),'warn');return}
    boom('🪦');toast(LN_(`${L} budget: deceased. 🪦 ${pick(['Press F.','It had a good run.','Reduced to atoms.','Gone. Like my sleep schedule.'])}`,`${L} budget: swargwas. 🪦 ${pick(['F.','Achha khela.','Atoms mein badal gaya.','Gaya. Meri neend ki tarah.'])}`),'warn');return}
  if(best.th>=.8){quake();toast(LN_(`80% of ${L} gone. Budget on life support. 🫁`,`${L} ka 80% gaya. Budget ventilator pe hai. 🫁`),'warn');return}
  toast(LN_(`Half of ${L} gone. It is ${tm}. Noted. 😐`,`${L} ka aadha gaya. Abhi ${tm} baje hain. Noted. 😐`));
}

function b64e(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
function makeCode(c){const d=myCardData(c);delete d.img;const j=JSON.stringify(d);return'AURA1.'+b64e(j)+'.'+hash('aura'+j).toString(36)}
function parseCode(code){
  code=String(code||'').trim().replace(/\s+/g,'');const m=code.match(/AURA1\.([A-Za-z0-9_-]+)\.([a-z0-9]+)/);if(!m)throw new Error('That is not an Aura code. 🤨');
  let j;try{j=b64d(m[1])}catch(e){throw new Error('Code is broken. Copy it again.')}
  if(hash('aura'+j).toString(36)!==m[2])throw new Error('Code was edited. Nice try, hacker. 🕵️');
  let d;try{d=JSON.parse(j)}catch(e){throw new Error('Code is broken. Copy it again.')}
  const n=v=>clamp(Math.round(Number(v)||0));
  return{i:String(d.i||'').slice(0,40),n:String(d.n||'Anonymous').slice(0,24),a:firstGrapheme(d.a)||'🗿',g:n(d.g),d:n(d.d),c:n(d.c),f:n(d.f),au:clamp(Math.round(Number(d.au)||0),0,1000),l:clamp(parseInt(d.l)||1,1,999),
    t:TYPES[d.t]?d.t:'npc',gp:clamp(Math.round((Number(d.gp)||0)*10)/10,0,100),s:clamp(parseInt(d.s)||0,0,9999),k:Array.isArray(d.k)?d.k.slice(0,2).map(k=>[firstGrapheme(k[0])||'🗿',String(k[1]||'').slice(0,30),['S','A','B','C','D','F','–'].includes(k[2])?k[2]:'–']):[],
    w:Array.isArray(d.w)?[firstGrapheme(d.w[0])||'🧮',String(d.w[1]||'').slice(0,20)]:null,ts:Number(d.ts)||Date.now(),nb:clamp(parseInt(d.nb)||0,0,99),r:d.r===0?0:1};
}

function nextRecDate(r,from){const d=pd(from);let y=d.getFullYear(),m=d.getMonth();let c=new Date(y,m,r.day);if(ymd(c)<from){m++;if(m>11){m=0;y++}c=new Date(y,m,r.day)}return ymd(c)}
function recNext(r){return r.last?nextRecDate(r,addDays(r.last,1)):nextRecDate(r,r.start)}
async function runRecurring(){
  if(!S.recurring||!S.recurring.length)return 0;const made=[];const t=today();
  for(const r of S.recurring){let next=recNext(r),guard=0;
    while(next<=t&&guard++<24){
      const e={id:'rec-'+r.id+'-'+next,type:'spend',date:next,amt:r.amt,cat:S.cats.some(c=>c.id===r.cat)?r.cat:'other',note:r.name,rec:r.id,created:Date.now(),time:pd(next).getTime()+9*36e5};
      if(!E.some(x=>x.id===e.id)){await dbPut('entries',e);E.push(e);made.push(e)}
      r.last=next;next=nextRecDate(r,addDays(next,1))}}
  if(made.length){await saveS();toast(made.length===1?`🔁 Auto-logged ${made[0].note} ${inr(made[0].amt)}`:`🔁 Auto-logged ${made.length} repeating spends`)}

function prevPeriod(){const[a]=periodRange('monthly');return periodRange('monthly',addDays(a,-1))}
function recapData(a,b){
  const sp=E.filter(e=>e.type==='spend'&&e.date>=a&&e.date<=b),gv=E.filter(e=>e.type==='give'&&e.date>=a&&e.date<=b);
  const spent=sp.reduce((s,e)=>s+e.amt,0),given=gv.reduce((s,e)=>s+e.amt,0);
  const[pa,pb]=periodRange('monthly',addDays(a,-1));const prevSpent=sumSpend(pa,pb);
  const byCat={};sp.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amt);
  const topId=Object.keys(byCat).sort((x,y)=>byCat[y]-byCat[x])[0];const top=topId?catOf(topId):null;
  const byDay={};sp.forEach(e=>byDay[e.date]=(byDay[e.date]||0)+e.amt);const maxDay=Object.keys(byDay).sort((x,y)=>byDay[y]-byDay[x])[0];
  const days=diffDays(a,b)+1;const ld=new Set(E.filter(e=>!e.rec&&e.date>=a&&e.date<=b).map(e=>e.date)).size;
  const zero=new Set(E.filter(e=>e.type==='nospend'&&e.date>=a&&e.date<=b).map(e=>e.date)).size;
  const base=Math.max(S.income||0,spent+given);
  return{a,b,spent,given,givePct:base?given/base*100:0,top,topPct:top&&spent?byCat[topId]/spent*100:0,maxDay,maxDayAmt:maxDay?byDay[maxDay]:0,days,ld,zero,change:prevSpent>0?(spent-prevSpent)/prevSpent*100:null,n:sp.length+gv.length};
}

const b64small=u8=>btoa(String.fromCharCode(...u8));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function bytesToB64(u8){const s=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(new Blob([u8]))});return s.slice(s.indexOf(',')+1)}
async function pwKey(pw,salt,it,use){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,[use])}
async function encryptText(str,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),it=250000;
  const key=await pwKey(pw,salt,it,'encrypt');const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(str)));
  return{app:'aurawallet',v:2,enc:{alg:'AES-GCM-256',kdf:'PBKDF2-SHA256',it,salt:b64small(salt),iv:b64small(iv)},data:await bytesToB64(ct)}}
async function decryptText(j,pw){const it=parseInt(j.enc.it)||250000;const key=await pwKey(pw,unb64(j.enc.salt),it,'decrypt');
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(j.enc.iv)},key,unb64(j.data));return new TextDecoder().decode(pt)}

function rrect(x,X,Y,w,h,r){x.beginPath();if(x.roundRect)x.roundRect(X,Y,w,h,r);else x.rect(X,Y,w,h)}
function qrCanvas(text,size){
  const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=3,cell=Math.max(2,Math.floor(size/(n+m*2)));
  const cv=document.createElement('canvas');cv.width=cv.height=cell*(n+m*2);const x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#111';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect((c+m)*cell,(r+m)*cell,cell,cell);return cv;
}
async function storyPNG(d){
  try{await document.fonts.load('40px Bangers');await document.fonts.load('700 30px Fredoka')}catch(e){}
  const W=1080,H=1920,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#FFE66D';x.fillRect(0,0,W,H);
  x.save();x.translate(W/2,820);x.fillStyle='#FFD23F';for(let i=0;i<36;i+=2){x.beginPath();x.moveTo(0,0);x.arc(0,0,2400,i*Math.PI/18,(i+1)*Math.PI/18);x.closePath();x.fill()}x.restore();
  const g=x.createRadialGradient(W/2,H+200,100,W/2,H+200,1100);g.addColorStop(0,'rgba(255,93,162,.45)');g.addColorStop(1,'rgba(255,93,162,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.textAlign='center';x.textBaseline='alphabetic';x.lineJoin='round';
  x.font='108px Bangers';x.fillStyle='#111';x.fillText("I'M FARMING AURA",W/2+7,157);x.lineWidth=12;x.strokeStyle='#111';x.strokeText("I'M FARMING AURA",W/2,150);x.fillStyle='#fff';x.fillText("I'M FARMING AURA",W/2,150);
  x.font='700 38px Fredoka';x.fillStyle='#111';x.fillText('by tracking money and giving back 🫶',W/2,215);
  const cb=await cardPNG(d);const u=URL.createObjectURL(cb);const im=new Image();im.src=u;await im.decode();
  const cw=760,ch=cw*im.height/im.width;x.save();x.translate(W/2,262+ch/2);x.rotate(-0.03);x.drawImage(im,-cw/2,-ch/2,cw,ch);x.restore();URL.revokeObjectURL(u);
  let y=262+ch+40;const bx=70,bw=W-140,bh=330;
  x.fillStyle='#111';rrect(x,bx+10,y+10,bw,bh,36);x.fill();x.fillStyle='#FFFDF5';rrect(x,bx,y,bw,bh,36);x.fill();x.lineWidth=7;x.strokeStyle='#111';x.stroke();
  x.drawImage(qrCanvas(SHARE_URL,260),bx+34,y+35,260,260);
  x.textAlign='left';x.fillStyle='#111';x.font='62px Bangers';x.fillText('GET AURA WALLET',bx+322,y+98);
  x.font='700 31px Fredoka';['✅ Free, no ads','🏦 No bank link','🔐 No login, no tracking','📴 Works offline'].forEach((t,i)=>x.fillText(t,bx+322,y+152+i*44));
  y+=bh+70;x.textAlign='center';x.font='700 36px Fredoka';x.fillText(d.g>0?`My GIVE score: ${d.g}. Beat it. 😤`:'Your move. 😤',W/2,y);
  x.font='600 27px Fredoka';x.fillText(SHARE_URL.replace('https://',''),W/2,y+48);
  if(CREATOR.handle){x.font='30px Bangers';x.fillText('MADE BY '+String(CREATOR.handle).toUpperCase()+' 🗿',W/2,H-50)}
  return await new Promise(r=>cv.toBlob(r,'image/png'));
}
