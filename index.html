<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFD60A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Aura Wallet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:'Bangers';src:url(bangers.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Fredoka';font-weight:400;src:url(fredoka-400.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Fredoka';font-weight:500;src:url(fredoka-500.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Fredoka';font-weight:600;src:url(fredoka-600.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Fredoka';font-weight:700;src:url(fredoka-700.woff2) format('woff2');font-display:swap}
:root{--y:#FFD60A;--p:#FF5DA2;--c:#3DDCFF;--l:#B8F24A;--o:#FF8A3D;--v:#A78BFA;--m:#7CF5C8;--gold:#FFC83D;--ink:#111;--paper:#FFFDF5;--red:#FF3B3B;--green:#19C37D;
  --sh:4px 4px 0 var(--ink);--sh2:6px 6px 0 var(--ink);--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:#FFE66D;min-height:100vh;overscroll-behavior-y:none;overflow-x:hidden}
.bg{position:fixed;inset:-50vmax;z-index:-2;background:repeating-conic-gradient(from 0deg,#FFE66D 0 10deg,#FFD23F 10deg 20deg);animation:sun 90s linear infinite}
.bg2{position:fixed;inset:0;z-index:-1;background:radial-gradient(rgba(0,0,0,.13) 1.2px,transparent 1.3px) 0 0/10px 10px,radial-gradient(ellipse at 50% 120%,rgba(255,93,162,.35),transparent 60%)}
@keyframes sun{to{transform:rotate(360deg)}}
h1,h2,h3,.bang{font-family:'Bangers',cursive;letter-spacing:1px;font-weight:400;margin:0}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--top) + 10px) 14px calc(var(--bot) + 116px)}
/* header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ava{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);box-shadow:var(--sh);background:var(--m) center/cover;display:grid;place-items:center;font-size:32px;flex:none;animation:wob 3.4s ease-in-out infinite;cursor:pointer;overflow:hidden}
@keyframes wob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) scale(1.04)}}
.who{flex:1;min-width:0}
.who h1{font-size:28px;line-height:.95;color:#fff;-webkit-text-stroke:1.4px var(--ink);text-shadow:3px 3px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{margin-top:5px;height:14px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;position:relative;box-shadow:2px 2px 0 var(--ink)}
.xp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--p),var(--v));border-right:2px solid var(--ink);transition:width .8s cubic-bezier(.3,1.5,.5,1)}
.xp b{position:absolute;inset:0;font-size:10px;line-height:10px;text-align:center;font-weight:700}
.lvl{background:var(--ink);color:var(--y);border-radius:14px;padding:6px 9px;text-align:center;transform:rotate(4deg);box-shadow:3px 3px 0 var(--p);cursor:pointer}
.lvl b{font-family:'Bangers';font-size:24px;display:block;line-height:1}
.lvl small{font-size:10px;font-weight:600}
.gear{width:42px;height:42px;border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--ink);font-size:20px;display:grid;place-items:center;flex:none}
.chipsrow{display:flex;gap:8px;margin:-2px 0 14px;flex-wrap:wrap}
.pill{background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
/* cards & tiles */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:var(--sh2);padding:14px;margin-bottom:16px}
.card h2{font-size:24px;margin-bottom:8px}
.tl{transform:rotate(-.7deg)}.tr{transform:rotate(.7deg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tile{border:3px solid var(--ink);border-radius:16px;box-shadow:var(--sh);padding:10px 12px;position:relative;overflow:hidden}
.tile .lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.tile .val{font-family:'Bangers';font-size:32px;line-height:1.05;margin-top:2px;word-break:break-all}
.tile .hint{font-size:12px;font-weight:500;opacity:.85}
.tile .emo{position:absolute;right:8px;top:6px;font-size:22px}
.full{grid-column:1/-1}
.givetile{background:linear-gradient(135deg,#FFE27A,#FFC83D 45%,#FF9F1C);text-align:center;animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:4px 4px 0 var(--ink),0 0 0 rgba(255,200,61,0)}50%{box-shadow:4px 4px 0 var(--ink),0 0 26px rgba(255,170,0,.85)}}
.givetile .val{font-size:56px}
.bigsafe .val{font-size:44px}
.nag{background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:var(--sh);padding:12px;margin-bottom:16px;font-weight:600;display:flex;gap:10px;align-items:center}
.nag button{margin-left:auto;background:var(--y);border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-weight:700;box-shadow:2px 2px 0 var(--ink);flex:none}
/* bars */
.bud{margin:10px 0 14px}
.bud .top2{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:5px}
.bud .top2 .ce{width:34px;height:34px;border:2px solid var(--ink);border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.bud .top2 .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud .top2 small{font-weight:500;opacity:.7}
.track{height:20px;border:2.5px solid var(--ink);border-radius:999px;background:#eee;overflow:hidden;position:relative}
.track .fill{height:100%;border-right:2px solid var(--ink);transition:width .7s cubic-bezier(.3,1.6,.5,1)}
.track .pace{position:absolute;top:-2px;bottom:-2px;border-left:3px dashed var(--ink);opacity:.55}
.track .over{background:repeating-linear-gradient(45deg,var(--red) 0 8px,#ff7a7a 8px 16px)!important}
.bud .sub{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-top:3px;opacity:.85}
.grade{display:inline-grid;place-items:center;min-width:28px;height:28px;border:2.5px solid var(--ink);border-radius:8px;font-family:'Bangers';font-size:18px;box-shadow:2px 2px 0 var(--ink);flex:none;padding:0 4px}
.gS{background:var(--gold)}.gA{background:var(--l)}.gB{background:var(--m)}.gC{background:var(--c)}.gD{background:var(--o)}.gF{background:var(--red);color:#fff}.gN{background:#ddd}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(var(--bot) + 10px);z-index:20;pointer-events:none}
nav .bar{pointer-events:auto;max-width:540px;margin:0 auto;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--sh2);display:flex;align-items:center;justify-content:space-around;padding:6px}
nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;padding:4px 6px;border-radius:12px;min-width:54px}
nav button span{font-size:22px;line-height:1.1;transition:transform .2s}
nav button.on{background:var(--y);border:2px solid var(--ink)}
nav button.on span{transform:scale(1.2) rotate(-8deg)}
nav .plus{width:66px;height:66px;margin-top:-34px;border-radius:50%;background:var(--p);border:3px solid var(--ink);box-shadow:var(--sh);font-size:40px;font-weight:700;line-height:1;display:grid;place-items:center;animation:idle 7s ease-in-out infinite}
@keyframes idle{0%,86%,100%{transform:none}88%{transform:rotate(-18deg) scale(1.08)}91%{transform:rotate(16deg) scale(1.08)}94%{transform:rotate(-10deg)}97%{transform:rotate(6deg)}}
nav .plus.angry{background:var(--red);color:#fff;animation:angry .9s ease-in-out infinite}
@keyframes angry{0%,100%{transform:scale(1)}50%{transform:scale(1.14) rotate(8deg)}}
/* forms */
label.f{display:block;font-weight:700;font-size:13px;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.5px}
.inp{width:100%;border:3px solid var(--ink);border-radius:14px;padding:11px 12px;background:#fff;box-shadow:3px 3px 0 var(--ink);outline:none}
.inp:focus{background:#FFF8C9}
.inp.bad{background:#ffd6d6;animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.amt-inp{font-family:'Bangers';font-size:46px;text-align:center;letter-spacing:2px;padding:6px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2.5px solid var(--ink);border-radius:999px;padding:7px 12px;background:#fff;font-weight:600;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.chip.on{transform:translate(-1px,-1px) rotate(-2deg);box-shadow:4px 4px 0 var(--ink)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catbtn{border:3px solid var(--ink);border-radius:14px;padding:8px 2px;background:#fff;font-weight:700;font-size:11px;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.catbtn span{font-size:26px}
.catbtn em{font-style:normal;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.catbtn.on{transform:rotate(-3deg) scale(1.05);box-shadow:5px 5px 0 var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:var(--sh);margin-bottom:6px}
.seg button{border:none;padding:12px;font-family:'Bangers';font-size:24px;letter-spacing:1px;background:#fff}
.seg button+button{border-left:3px solid var(--ink)}
.seg button.on.sp{background:var(--p)}.seg button.on.gv{background:var(--gold)}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:none}.sugg::-webkit-scrollbar{display:none}
.sugg .chip{white-space:nowrap;font-size:13px;padding:5px 10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:3px solid var(--ink);border-radius:16px;padding:13px;font-weight:700;font-size:17px;box-shadow:var(--sh);background:var(--y);margin-top:12px;text-decoration:none;color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.p{background:var(--p)}.btn.c{background:var(--c)}.btn.l{background:var(--l)}.btn.w{background:#fff}.btn.r{background:var(--red);color:#fff}.btn.v{background:var(--v)}.btn.g{background:var(--gold)}.btn.m{background:var(--m)}
.btn.mega{font-family:'Bangers';font-size:28px;letter-spacing:1.5px;padding:14px}
.btn.sm{padding:9px;font-size:15px;margin-top:8px}
.photo-pick{border:3px dashed var(--ink);border-radius:14px;padding:12px;text-align:center;background:#fff;font-weight:600;position:relative}
.photo-pick input{position:absolute;inset:0;opacity:0;width:100%}
.photo-prev{position:relative;margin-top:8px}
.photo-prev img{width:100%;max-height:200px;object-fit:contain;border:3px solid var(--ink);border-radius:14px;background:#000}
.photo-prev button{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px 10px;font-weight:700}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.sw.on{outline:3px solid var(--ink);outline-offset:3px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{font-size:24px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px 0}
.emojis button.on{background:var(--y);transform:scale(1.1)}
/* sheet & modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border:3px solid var(--ink);border-bottom:none;border-radius:26px 26px 0 0;padding:16px 16px calc(var(--bot) + 20px);animation:up .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:60px;height:6px;border-radius:9px;background:var(--ink);margin:0 auto 10px}
.sheet h2{font-size:30px;text-align:center}
.modal-scrim{align-items:center;padding:20px}
.modal{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--sh2);padding:18px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:30px;text-align:center;margin-bottom:6px}
.modal p{text-align:center;margin:6px 0}
.mini{font-size:12px;opacity:.75;margin-top:6px}
/* lists */
.daygrp{margin-bottom:14px}
.dayhead{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--y);border-radius:12px 12px 0 0;padding:6px 12px;font-family:'Bangers';font-size:20px;letter-spacing:1px}
.dayhead small{font-family:'Fredoka';color:#fff;font-size:12px;font-weight:600}
.daybody{background:var(--paper);border:3px solid var(--ink);border-top:none;border-radius:0 0 14px 14px;box-shadow:var(--sh)}
.ent{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:2px dashed #bbb}
.ent:last-child{border-bottom:none}
.ent .ic{width:40px;height:40px;border:2px solid var(--ink);border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.ent .mid{flex:1;min-width:0}
.ent .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .mid small{font-size:12px;opacity:.75}
.ent .rt{text-align:right;font-weight:700;white-space:nowrap}
.ent.give .rt{color:#B7791F}
.tag{display:inline-block;font-size:10px;font-weight:700;border:1.5px solid var(--ink);border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:1px;background:var(--gold)}
.empty{text-align:center;padding:26px 12px}
.empty .e{font-size:60px;display:block;animation:wob 2s infinite}
.secthead{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px;gap:8px}
.secthead h2{font-size:32px;color:#fff;-webkit-text-stroke:1.3px var(--ink);text-shadow:3px 3px 0 var(--ink)}
/* POKE CARD */
.pkwrap{perspective:900px;margin:4px auto 18px;max-width:340px}
.pk{position:relative;aspect-ratio:63/88;border-radius:18px;padding:9px;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);transform-style:preserve-3d;transition:transform .15s ease-out;animation:floaty 5s ease-in-out infinite;
  background:var(--rb,linear-gradient(135deg,#ddd,#bbb))}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -6px}}
.pk .in{height:100%;border-radius:11px;border:2.5px solid var(--ink);padding:8px 9px;display:flex;flex-direction:column;gap:6px;background:var(--tb,#eee);position:relative;overflow:hidden}
.pk .hd{display:flex;align-items:center;gap:6px}
.pk .hd .nm{font-family:'Bangers';font-size:22px;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .hd .hp{font-family:'Bangers';font-size:24px;line-height:1;color:#c00;-webkit-text-stroke:.6px var(--ink)}
.pk .hd .hp small{font-size:12px;color:var(--ink);-webkit-text-stroke:0}
.pk .hd .ty{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.pk .art{flex:0 0 34%;border:3px solid var(--ink);border-radius:6px;background:radial-gradient(circle at 50% 60%,#fff 0 20%,transparent 60%),var(--ab,linear-gradient(135deg,#fff,#ddd));display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.pk .art .big{font-size:78px;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.35));animation:wob 4s ease-in-out infinite}
.pk .art img{width:62%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid var(--ink)}
.pk .art .rar{position:absolute;right:5px;bottom:4px;font-size:11px;font-weight:700;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px}
.pk .art .lv{position:absolute;left:5px;top:4px;font-family:'Bangers';font-size:16px;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:0 5px}
.pk .typeline{font-size:10px;font-weight:700;text-align:center;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);margin-top:-3px}
.pk .gv{border:2.5px solid var(--ink);border-radius:10px;background:linear-gradient(135deg,#FFF1A8,#FFC83D);padding:5px 8px;display:flex;align-items:center;gap:8px;box-shadow:2px 2px 0 var(--ink)}
.pk .gv .n{font-family:'Bangers';font-size:34px;line-height:1}
.pk .gv .t{flex:1;font-size:11px;font-weight:700;line-height:1.15}
.pk .gv .t b{display:block;font-family:'Bangers';font-size:17px;font-weight:400;letter-spacing:.5px}
.pk .st{display:grid;grid-template-columns:auto 1fr 26px;align-items:center;gap:5px;font-size:10px;font-weight:700}
.pk .st .tr2{height:9px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.pk .st .tr2 i{display:block;height:100%}
.pk .st b{text-align:right;font-family:'Bangers';font-size:15px;font-weight:400}
.pk .atk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-top:1.5px solid rgba(0,0,0,.25);padding-top:4px}
.pk .atk .an{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .atk .grade{min-width:22px;height:22px;font-size:14px;border-width:2px;box-shadow:1px 1px 0 var(--ink)}
.pk .ft{margin-top:auto;display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;border-top:1.5px solid rgba(0,0,0,.3);padding-top:4px;gap:6px}
.pk .ft span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk::after{content:"";position:absolute;inset:0;border-radius:15px;pointer-events:none;mix-blend-mode:color-dodge;opacity:var(--holo,0);
  background:repeating-linear-gradient(115deg,rgba(255,0,128,.45) 0%,rgba(255,200,0,.45) 6%,rgba(0,255,170,.45) 12%,rgba(0,140,255,.45) 18%,rgba(190,0,255,.45) 24%,rgba(255,0,128,.45) 30%);
  background-size:300% 300%;background-position:var(--mx,50%) var(--my,50%);transition:background-position .1s}
.pk::before{content:"";position:absolute;inset:0;border-radius:15px;pointer-events:none;z-index:2;background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.55),transparent 45%);opacity:.6;mix-blend-mode:overlay}
/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--ink);padding:8px 4px;text-align:center;font-size:11px;font-weight:700;line-height:1.15}
.bdg span{font-size:30px;display:block}
.bdg.lock{background:#ddd;filter:grayscale(1);opacity:.55}
.bdg.lock span{filter:blur(1px)}
/* squad */
.rank{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:var(--sh);padding:10px 12px;margin-bottom:12px}
.rank.me{background:linear-gradient(135deg,#FFF1A8,#FFE066)}
.rank .pos{font-family:'Bangers';font-size:30px;width:38px;text-align:center}
.rank .rav{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-size:26px;background:var(--m);flex:none;overflow:hidden}
.rank .rav img{width:100%;height:100%;object-fit:cover}
.rank .mid{flex:1;min-width:0}
.rank .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .mid small{font-size:12px;opacity:.75}
.rank .sc{text-align:right}

const DEF=()=>({v:1,uid:uid(),name:'',avatar:'🗿',avatarImg:'',income:0,monthStart:1,overall:{daily:0,weekly:0,monthly:0},cats:[{...OTHER}],badges:{},squad:[],remind:'21:30',setup:false,xpBonus:0,seen:{}});
const saveS=()=>dbPut('kv',{k:'settings',v:S}).catch(()=>toast('Could not save settings 😬','warn'));
function sanitizeSettings(raw){
  const d=DEF();const s=Object.assign(d,raw&&typeof raw==='object'?raw:{});
  s.name=String(s.name||'').slice(0,24);s.avatar=firstGrapheme(s.avatar)||'🗿';if(typeof s.avatarImg!=='string'||!s.avatarImg.startsWith('data:image/'))s.avatarImg='';
  s.income=money(s.income)||0;s.monthStart=clamp(parseInt(s.monthStart)||1,1,28);
  s.overall=Object.assign({daily:0,weekly:0,monthly:0},s.overall||{});for(const k of ['daily','weekly','monthly'])s.overall[k]=money(s.overall[k])||0;
  const seen=new Set();let cats=Array.isArray(s.cats)?s.cats:[];
  cats=cats.filter(c=>c&&typeof c==='object').map(c=>({id:String(c.id||uid()),name:String(c.name||'').trim().slice(0,20)||'Unnamed',emoji:firstGrapheme(c.emoji)||'📦',
    color:/^#[0-9a-f]{6}$/i.test(c.color)?c.color:'#D9D9D9',period:['daily','weekly','monthly'].includes(c.period)?c.period:'monthly',budget:money(c.budget)||0,sys:c.id==='other'}))
    .filter(c=>{const k=c.name.toLowerCase();if(seen.has(c.id)||seen.has('n:'+k))return false;seen.add(c.id);seen.add('n:'+k);return true});
  if(!cats.find(c=>c.id==='other'))cats.push({...OTHER});
  s.cats=cats;s.badges=s.badges&&typeof s.badges==='object'?s.badges:{};s.squad=Array.isArray(s.squad)?s.squad.filter(x=>x&&x.i&&x.i!==s.uid):[];
  s.xpBonus=Math.max(0,parseInt(s.xpBonus)||0);s.seen=s.seen&&typeof s.seen==='object'?s.seen:{};
  if(!/^\d{2}:\d{2}$/.test(s.remind))s.remind='21:30';
  if(!validYmd(s.lastBackup||''))s.lastBackup='';if(!validYmd(s.backupSnooze||''))s.backupSnooze='';
  return s;
}
function sanitizeEntry(e){
  if(!e||typeof e!=='object')return null;
  const type=['spend','give','nospend'].includes(e.type)?e.type:null;if(!type)return null;
  const date=validYmd(e.date)?e.date:null;if(!date)return null;
  const o={id:String(e.id||uid()),type,date,created:Number(e.created)||Date.now(),time:Number(e.time)||Number(e.created)||Date.now(),note:String(e.note||'').slice(0,80)};
  if(type!=='nospend'){const a=money(e.amt);if(!a||a<=0)return null;o.amt=a}
  if(type==='spend')o.cat=S.cats.find(c=>c.id===e.cat)?e.cat:'other';
  if(type==='give')o.cause=CAUSES.some(c=>c[1]===e.cause)?e.cause:'Other good';
  if(e.photo instanceof Blob)o.photo=e.photo;
  return o;
}
async function load(){
  const kv=await dbAll('kv');const s=kv.find(x=>x.k==='settings');S=sanitizeSettings(s&&s.v);
  const raw=await dbAll('entries');E=[];for(const r of raw){const e=sanitizeEntry(r);if(e)E.push(e)}
}
const catOf=id=>S.cats.find(c=>c.id===id)||S.cats.find(c=>c.id==='other');

/* =================== PERIODS =================== */
function dim(y,m){return new Date(y,m+1,0).getDate()}
function periodRange(p,ref=today()){
  if(p==='daily')return[ref,ref];
  if(p==='weekly'){const w=(pd(ref).getDay()+6)%7;const s=addDays(ref,-w);return[s,addDays(s,6)]}
  const ms=S.monthStart||1;const d=pd(ref);let y=d.getFullYear(),m=d.getMonth();if(d.getDate()<ms){m--;if(m<0){m=11;y--}}
  const s=new Date(y,m,Math.min(ms,dim(y,m)));let ny=y,nm=m+1;if(nm>11){nm=0;ny++}const n=new Date(ny,nm,Math.min(ms,dim(ny,nm)));n.setDate(n.getDate()-1);return[ymd(s),ymd(n)];
}
function dayFrac(d=new Date()){return clamp((d.getHours()+d.getMinutes()/60-7)/16,0.03,1)} // waking hours 7am-11pm
function elapsed(p){const[a,b]=periodRange(p);const len=diffDays(a,b)+1;const done=diffDays(a,today());return clamp((done+dayFrac())/len,0.01,1)}
function sumSpend(a,b,cat){let s=0;for(const e of E)if(e.type==='spend'&&e.date>=a&&e.date<=b&&(!cat||e.cat===cat))s+=e.amt;return s}
function sumGive(a,b){let s=0;for(const e of E)if(e.type==='give'&&e.date>=a&&e.date<=b)s+=e.amt;return s}
function budgetScore(u,t){if(u<=t)return 100;if(u<=1)return 100-(u-t)/Math.max(1-t,.0001)*40;return Math.max(0,60-(u-1)*120)}

/* =================== SCORES =================== */
function scopes(){ // all active budgets
  const out=[];
  for(const p of ['daily','weekly','monthly'])if(S.overall[p]>0){const[a,b]=periodRange(p);out.push({key:'all-'+p,label:(p==='daily'?"today's":p==='weekly'?"this week's":"this month's")+' total',short:{daily:'Daily total',weekly:'Weekly total',monthly:'Monthly total'}[p],p,a,b,budget:S.overall[p],spent:sumSpend(a,b)})}
  for(const c of S.cats)if(c.budget>0){const[a,b]=periodRange(c.period);out.push({key:'cat-'+c.id,cat:c,label:`${c.emoji} ${c.name} (${PERIOD_LBL[c.period]})`,short:c.name,p:c.period,a,b,budget:c.budget,spent:sumSpend(a,b,c.id)})}
  for(const s of out){s.u=s.spent/s.budget;s.t=elapsed(s.p);s.score=budgetScore(s.u,s.t)}
  return out;
}
function loggedDays(){return new Set(E.map(e=>e.date))}
function streak(){const d=loggedDays();let x=d.has(today())?today():addDays(today(),-1),n=0;while(d.has(x)){n++;x=addDays(x,-1)}return n}
function xpTotal(){let x=S.xpBonus||0;for(const e of E){x+=e.type==='spend'?10:e.type==='give'?30+(e.photo?20:0):15}x+=Object.keys(S.badges).length*50;return x}
function levelOf(x){const l=Math.floor(Math.sqrt(x/40))+1;return{l,cur:40*(l-1)**2,next:40*l**2}}
function calc(){
  const t=today(),a30=addDays(t,-29);
  const give30=sumGive(a30,t),spend30=sumSpend(a30,t);
  const base30=Math.max(S.income||0,spend30+give30);
  const ratio=base30>0?give30/base30:0;
  const ratioScore=100*(1-Math.exp(-ratio/0.06));
  let weeks=0;for(let w=0;w<4;w++){if(sumGive(addDays(t,-7*w-6),addDays(t,-7*w))>0)weeks++}
  const give=Math.round(0.8*ratioScore+0.2*weeks*25);
  const sc=scopes();
  const disc=sc.length?Math.round(sc.reduce((s,x)=>s+x.score,0)/sc.length):null;
  const ld=loggedDays();let l14=0;for(let i=0;i<14;i++)if(ld.has(addDays(t,-i)))l14++;
  const stk=streak();const cons=Math.round(clamp(l14/14*70+Math.min(stk,14)/14*30));
  const[ma,mb]=periodRange('monthly');const spentM=sumSpend(ma,mb);const tm=elapsed('monthly');
  const ref=S.income>0?S.income:S.overall.monthly>0?S.overall.monthly:0;
  let frug=null;if(ref>0){const r=spentM/(ref*Math.max(tm,.03));frug=Math.round(clamp(100-Math.max(0,r-.6)*125))}else if(disc!=null)frug=disc;
  const D=disc??50,F=frug??50;
  const aura=Math.round(10*(0.4*give+0.25*D+0.2*cons+0.15*F));
  const xp=xpTotal();const lv=levelOf(xp);
  const stats={give,disc:D,cons,frug:F};
  let tk='npc',mx=-1;for(const k of ['give','disc','cons','frug'])if(stats[k]>mx){mx=stats[k];tk=k}if(mx<40)tk='npc';
  const rar=RARITY.find(r=>aura>=r[0]);
  // per category this month
  const catRows=S.cats.map(c=>{const sp=sumSpend(ma,mb,c.id);const s=sc.find(x=>x.key==='cat-'+c.id);return{c,spent:sp,score:s?Math.round(s.score):null,scope:s}}).sort((a,b)=>b.spent-a.spent);
  const atks=catRows.filter(r=>r.spent>0).slice(0,2).map(r=>({e:r.c.emoji,n:r.c.name+' '+ATK_VERBS[hash(r.c.name)%ATK_VERBS.length],g:gradeOf(r.score),dmg:r.spent}));
  const weak=sc.filter(x=>x.score<60).sort((a,b)=>a.score-b.score)[0];
  return{give,disc,cons,frug,stats,aura,xp,lv,tk,rar,give30,spend30,base30,givePct:ratio*100,weeks,streak:stk,l14,sc,catRows,atks,weak,spentM,ma,mb};
}

let toastT;
function toast(msg,kind='',undo){const t=$('#toast');t.className=kind;t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button id="tUndo">Undo</button>':''}`;void t.offsetWidth;t.classList.add('show');
  if(undo)$('#tUndo').onclick=()=>{t.classList.remove('show');undo()};clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),undo?5500:2600)}
function confetti(x,y,em=['💸','🎉','✨','💰','⭐','🗿']){for(let i=0;i<16;i++){const s=document.createElement('div');s.className='conf';s.textContent=pick(em);s.style.left=(x??innerWidth/2)+'px';s.style.top=(y??innerHeight/2)+'px';
  s.style.setProperty('--dx',(Math.random()*300-150)+'px');s.style.setProperty('--dy',(Math.random()*-320-40)+'px');s.style.setProperty('--rot',(Math.random()*720-360)+'deg');document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}
function rain(em,n=24){for(let i=0;i<n;i++){const s=document.createElement('div');s.className='conf';s.textContent=Array.isArray(em)?pick(em):em;s.style.left=Math.random()*innerWidth+'px';s.style.top='-40px';
  s.style.setProperty('--dx',(Math.random()*60-30)+'px');s.style.setProperty('--dy',(innerHeight+80)+'px');s.style.setProperty('--rot',(Math.random()*360)+'deg');s.style.animationDuration=(1.2+Math.random()*1.2)+'s';s.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3000)}}
function buzz(p=15){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

function floater(txt,x,y){const f=document.createElement('div');f.className='floater';f.textContent=txt;f.style.left=(x??innerWidth/2)+'px';f.style.top=(y??innerHeight/2)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1500)}
let loadT;function loading(on){clearInterval(loadT);const el=$('#loadingTxt');el.textContent=pick(LOADS);$('#loading').classList.toggle('show',on);if(on){let i=0;loadT=setInterval(()=>el.textContent=LOADS[i++%LOADS.length],900)}}
function countUp(){$$('[data-n]').forEach(el=>{const to=+el.dataset.n,pre=el.dataset.pre||'',suf=el.dataset.suf||'',isMoney=el.dataset.m==='1';const t0=performance.now(),D=750;

function popAll(){$$('#view .card,#view .tile,#view .daygrp,#view .nag,#view .secthead,#view .rank,#view .pkwrap').forEach((el,i)=>{el.classList.remove('popin');void el.offsetWidth;el.style.animationDelay=(i*50)+'ms';el.classList.add('popin')})}
function moaiWalk(){if(matchMedia('(prefers-reduced-motion: reduce)').matches||document.hidden||openCount())return;const m=document.createElement('div');m.className='moai';m.innerHTML=`<b>${esc(pick(MOAI))}</b><i>🗿</i>`;document.body.appendChild(m);setTimeout(()=>m.remove(),9200)}
(function loopMoai(){setTimeout(()=>{moaiWalk();loopMoai()},30000+Math.random()*40000)})();
document.addEventListener('click',e=>{const b=e.target.closest('button,.btn,.chip');if(!b||b.classList.contains('plus'))return;b.classList.remove('jelly');void b.offsetWidth;b.classList.add('jelly');setTimeout(()=>b.classList.remove('jelly'),520)});

let lockModal=false,modalCb=null,skipPop=false,histPushed=false;
const isOpen=id=>$(id).classList.contains('show');
const openCount=()=>(isOpen('#sheetScrim')?1:0)+(isOpen('#modalScrim')?1:0);
function ovOpen(){if(!histPushed){try{history.pushState({ov:1},'');histPushed=true}catch(e){}}}
function ovClosed(fromPop){if(openCount()===0&&histPushed){histPushed=false;if(!fromPop){skipPop=true;history.back()}}}
addEventListener('popstate',()=>{if(skipPop){skipPop=false;return}histPushed=false;
  if($('#legal').classList.contains('show')){$('#legal').classList.remove('show');if(openCount()>0)ovOpen();return}
  if(isOpen('#modalScrim')){if(lockModal){ovOpen();return}closeModal(true)}else if(isOpen('#sheetScrim'))closeSheet(true);if(openCount()>0)ovOpen()});
function modal(html,lock=false){if(!lock&&!openCount())ovOpen();if(modalCb){const c=modalCb;modalCb=null;c()}lockModal=lock;$('#modal').innerHTML=html;$('#modal').scrollTop=0;$('#modalScrim').classList.add('show')}
function closeModal(fromPop){if(!isOpen('#modalScrim'))return;$('#modalScrim').classList.remove('show');lockModal=false;if(modalCb){const c=modalCb;modalCb=null;c()}ovClosed(fromPop);flushCelebrations()}
$('#modalScrim').addEventListener('click',e=>{if(e.target.id==='modalScrim'&&!lockModal)closeModal()});
$('#legalX').onclick=()=>$('#legal').classList.remove('show');
function openSheet(){if(!openCount())ovOpen();$('#sheetScrim').classList.add('show');$('#sheet').scrollTop=0}
function closeSheet(fromPop){if(!isOpen('#sheetScrim'))return;$('#sheetScrim').classList.remove('show');ovClosed(fromPop)}
$('#sheetScrim').addEventListener('click',e=>{if(e.target.id==='sheetScrim')closeSheet()});
function ask(title,msg,yes='Yes',no='Nope'){return new Promise(res=>{modal(`<h2>${title}</h2><p>${msg}</p><div class="row"><button class="btn w" id="mNo">${no}</button><button class="btn r" id="mYes">${yes}</button></div>`);
  modalCb=()=>res(false);$('#mNo').onclick=()=>closeModal();$('#mYes').onclick=()=>{modalCb=null;closeModal();res(true)}})}
function download(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function shareFile(blob,name,title,text){const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title,text});return}catch(e){if(e.name==='AbortError')return}}download(blob,name);toast('Downloaded instead 📥')}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied 📋')}catch(e){toast('Copy failed. Long-press the code instead.','warn')}}
const urlCache=new Map();function photoUrl(e){if(!e.photo)return'';if(!urlCache.has(e.id))urlCache.set(e.id,URL.createObjectURL(e.photo));return urlCache.get(e.id)}
async function shrink(file,M=1400,q=.75){const url=URL.createObjectURL(file);const img=new Image();img.src=url;await img.decode();let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,M/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);return await new Promise(r=>cv.toBlob(r,'image/jpeg',q))}
async function squareDataURL(file,S_=220){const url=URL.createObjectURL(file);const img=new Image();img.src=url;await img.decode();const m=Math.min(img.naturalWidth,img.naturalHeight);
  const cv=document.createElement('canvas');cv.width=cv.height=S_;cv.getContext('2d').drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,S_,S_);URL.revokeObjectURL(url);return cv.toDataURL('image/jpeg',.8)}

/* =================== CELEBRATIONS (badges / level) =================== */
const celebQ=[];
function queueCeleb(html,fx){celebQ.push({html,fx});if(!openCount())flushCelebrations()}
function flushCelebrations(){if(openCount()||!celebQ.length)return;const c=celebQ.shift();setTimeout(()=>{if(openCount()){celebQ.unshift(c);return}modal(c.html+`<button class="btn mega g" onclick="closeModal()">LET'S GOOO</button>`);c.fx&&c.fx()},350)}
function checkBadges(c){
  const has=id=>S.badges[id];const add=(id)=>{if(has(id))return;S.badges[id]=today();const b=BADGES.find(x=>x.id===id);
    queueCeleb(`<div style="text-align:center;font-size:90px;animation:wob 1.5s infinite">${b.e}</div><h2>Badge unlocked!</h2><p><b>${b.n}</b></p><p class="mini">${b.d}</p>`,()=>{confetti(innerWidth/2,innerHeight/2,['🏅','✨','🎉',b.e]);buzz([30,40,30,40,60])})};
  const gives=E.filter(e=>e.type==='give');
  if(gives.length)add('first_give');
  if(c.givePct>=5)add('give5');if(c.givePct>=10)add('give10');if(c.weeks>=4)add('saint');
  if(gives.filter(e=>e.photo).length>=3)add('proof3');
  if(c.streak>=7)add('streak7');if(c.streak>=30)add('streak30');
  if(E.some(e=>e.type==='nospend'))add('nospend');
  if(S.cats.some(x=>!x.sys&&!PRESETS.some(p=>p.id===x.id)))add('designer');
  if(E.length>=100)add('goblin');
  if(S.overall.daily>0){let ok=0;for(let i=1;i<=7;i++){const d=addDays(today(),-i);if(loggedDays().has(d)&&sumSpend(d,d)<=S.overall.daily)ok++}if(ok>=7)add('calm7')}
  saveS();
}

function nagNeeded(){if(!S.setup)return false;if(E.some(e=>e.date===today()))return false;const[h,m]=S.remind.split(':').map(Number);const n=new Date();return n.getHours()*60+n.getMinutes()>=Math.min(h*60+m,19*60)}

/* =================== BACKUP REMINDER =================== */
function backupInfo(){if(!E.length)return{due:false,days:null};const first=E.reduce((m,e)=>e.date<m?e.date:m,today());const since=S.lastBackup||first;const days=Math.max(0,diffDays(since,today()));
  const newer=S.lastBackup?E.some(e=>ymd(new Date(e.created))>S.lastBackup||e.date>S.lastBackup):true;
  return{days,never:!S.lastBackup,due:E.length>=5&&days>=7&&newer&&S.backupSnooze!==today()}}
/* =================== HOME =================== */
function safeToday(){
  const t=today();const spentT=sumSpend(t,t);const c=[];
  if(S.overall.daily>0)c.push({v:S.overall.daily-spentT,src:'daily budget'});
  for(const p of ['weekly','monthly'])if(S.overall[p]>0){const[a,b]=periodRange(p);const before=sumSpend(a,addDays(t,-1));const left=diffDays(t,b)+1;c.push({v:(S.overall[p]-before)/left-spentT,src:p+' budget ÷ '+left+' days left'})}
  if(!c.length)return null;return c.sort((a,b)=>a.v-b.v)[0];
}
function barHTML(s,showPace=true){const u=s.spent/s.budget;const g=gradeOf(s.score);const col=s.cat?s.cat.color:'var(--v)';

let saving=false;
async function saveEntry(ev){
  if(saving)return;
  const amtEl=$('#fAmt');F.amt=amtEl.value;F.note=($('#fNote').value||'').trim().slice(0,80);F.date=$('#fDate').value;
  const amt=money(F.amt);
  if(!amt||amt<=0){amtEl.classList.add('bad');setTimeout(()=>amtEl.classList.remove('bad'),500);toast('Amount: missing. Vibes: off. 🙄','warn');buzz(80);return}
  if(amt>1e7&&!(await ask('That much? 🤨',`${inr(amt)}. Are we sure? Typos happen.`,'Yes, really','Fix it')))return;
  if(!validYmd(F.date)){toast('Pick a real date 📅','warn');return}
  if(F.date>today()){toast('Future spending? Time traveller? 🕰️ Pick today or earlier.','warn');return}
  if(F.type==='spend'&&!S.cats.some(c=>c.id===F.cat))F.cat='other';
  saving=true;
  try{
    const before=calc();const scBefore=before.sc;
    const old=E.find(e=>e.id===F.id);
    const rec={id:F.id,type:F.type,date:F.date,amt,note:F.note,created:F.created||Date.now(),time:old&&old.date===F.date?old.time:(F.date===today()?Date.now():pd(F.date).getTime()+12*36e5)};
    if(F.type==='spend')rec.cat=F.cat;else rec.cause=F.cause;
    if(F.photo)rec.photo=F.photo;
    await dbPut('entries',rec);urlCache.delete(rec.id);
    const i=E.findIndex(e=>e.id===rec.id);if(i>=0)E[i]=rec;else E.push(rec);
    const r=ev.target.getBoundingClientRect();closeSheet();
    if(F._edit){toast('Updated. Nobody saw that. ✅')}
    else if(rec.type==='give'){
      const after=calc();rain(['🫶','💛','✨','🌟'],34);boom('🫶');floater(`+${after.give-before.give>0?after.give-before.give+' GIVE':'30 XP'}`,innerWidth/2,innerHeight/2-40);
      toast(pick(GIVE_LINES),'gold');
    }else{
      confetti(r.left+r.width/2,r.top);floater(`+10 XP`,r.left+r.width/2,r.top-10);
      reactSpend(rec,scBefore);
    }
    afterChange();
  }catch(err){console.error(err);toast('Save failed. Try again? 😬','warn')}
  finally{saving=false}
}
function reactSpend(rec,scBefore){
  if(rec.date!==today()&&!scopes().some(s=>rec.date>=s.a&&rec.date<=s.b)){toast(pick(SPEND_LINES));return}
  const after=scopes();const TH=[2,1.5,1,.8,.5];let best=null;
  for(const s of after){if(!(rec.date>=s.a&&rec.date<=s.b))continue;if(s.cat&&s.cat.id!==rec.cat)continue;
    const b=scBefore.find(x=>x.key===s.key);const ub=b?b.spent/b.budget:0;const ua=s.spent/s.budget;
    for(const th of TH){if(ua>=th&&ub<th){const sev=th+(s.key==='all-daily'?.01:0);if(!best||sev>best.sev)best={s,th,sev};break}}}
  const now=new Date(),hr=now.getHours(),tm=timeStr(now);
  if(!best){
    if(rec.amt===67){boom('🤲');toast('SIX SEVEN 🤲🤲');return}
    if(rec.amt<=20){toast(`${inr(rec.amt)}. Logging crumbs now. Respect. 🫡`);return}
    toast(pick(SPEND_LINES));return}
  const L=best.s.label;
  if(best.th>=2){quake();rain(['🤡','💀'],26);toast(`200% of ${L} budget. The budget is a suggestion now. 🤡`,'warn');return}
  if(best.th>=1.5){quake();rain('🌽',18);toast(`150% of ${L}. We are in debt to ourselves. Ohio-tier. 🌽`,'warn');return}
  if(best.th>=1){
    if(best.s.key==='all-daily'&&rec.date===today()&&hr<12){
      if(!S.badges.speedrun){S.badges.speedrun=today();saveS();const b=BADGES.find(x=>x.id==='speedrun');queueCeleb(`<div style="text-align:center;font-size:90px">${b.e}</div><h2>Badge unlocked?</h2><p><b>${b.n}</b></p><p class="mini">${b.d}</p>`)}
      boom('🏃');rain(['💨','🏃','⏱️'],22);
      toast(hr<9?`${tm}. Whole day's budget: gone. Breakfast isn't even digested. Impressive. Concerning. 🫠`:`Whole day's budget gone by ${tm}. Speedrun any%. World record. 🏃💨`,'warn');return}
    boom('🪦');toast(`${L} budget: deceased. 🪦 ${pick(['Press F.','It had a good run.','Reduced to atoms.','Gone. Like my sleep schedule.'])}`,'warn');return}
  if(best.th>=.8){quake();toast(`80% of ${L} gone. Budget on life support. 🫁`,'warn');return}
  toast(`Half of ${L} gone. It is ${tm}. Noted. 😐`);
}

function b64e(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
function makeCode(c){const d=myCardData(c);delete d.img;const j=JSON.stringify(d);return'AURA1.'+b64e(j)+'.'+hash('aura'+j).toString(36)}
function parseCode(code){
  code=String(code||'').trim().replace(/\s+/g,'');const m=code.match(/AURA1\.([A-Za-z0-9_-]+)\.([a-z0-9]+)/);if(!m)throw new Error('That is not an Aura code. 🤨');
  let j;try{j=b64d(m[1])}catch(e){throw new Error('Code is broken. Copy it again.')}
  if(hash('aura'+j).toString(36)!==m[2])throw new Error('Code was edited. Nice try, hacker. 🕵️');
  let d;try{d=JSON.parse(j)}catch(e){throw new Error('Code is broken. Copy it again.')}
  const n=v=>clamp(Math.round(Number(v)||0));
  return{i:String(d.i||'').slice(0,40),n:String(d.n||'Anonymous').slice(0,24),a:firstGrapheme(d.a)||'🗿',g:n(d.g),d:n(d.d),c:n(d.c),f:n(d.f),au:clamp(Math.round(Number(d.au)||0),0,1000),l:clamp(parseInt(d.l)||1,1,999),
    t:TYPES[d.t]?d.t:'npc',gp:clamp(Math.round((Number(d.gp)||0)*10)/10,0,100),s:clamp(parseInt(d.s)||0,0,9999),k:Array.isArray(d.k)?d.k.slice(0,2).map(k=>[firstGrapheme(k[0])||'🗿',String(k[1]||'').slice(0,30),['S','A','B','C','D','F','–'].includes(k[2])?k[2]:'–']):[],
    w:Array.isArray(d.w)?[firstGrapheme(d.w[0])||'🧮',String(d.w[1]||'').slice(0,20)]:null,ts:Number(d.ts)||Date.now(),nb:clamp(parseInt(d.nb)||0,0,99)};
}

function calLink(){const[h,m]=S.remind.split(':').map(Number);const t=today().replace(/-/g,'');const e=new Date(2000,0,1,h,m+10);
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Kolkata';
  return`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('🗿 Log in Aura Wallet')}&details=${encodeURIComponent('Log today\'s spends (and gives 🫶). Streak is on the line.')}&dates=${t}T${pad(h)}${pad(m)}00/${t}T${pad(e.getHours())}${pad(e.getMinutes())}00&ctz=${encodeURIComponent(tz)}&recur=${encodeURIComponent('RRULE:FREQ=DAILY')}`}
function renderSettings(){
  $('#view').innerHTML=`<div class="secthead"><h2>Settings ⚙️</h2><button class="chip" onclick="go('home')">← Home</button></div>
  <div class="card tl"><h2>You 🪪</h2>
    <label class="f">Name</label><input class="inp" id="sName" maxlength="24" value="${esc(S.name)}">
    <label class="f">Avatar</label><div class="emojis">${AVATARS.map(a=>`<button data-av="${a}" class="${!S.avatarImg&&S.avatar===a?'on':''}">${a}</button>`).join('')}</div>
    <div class="photo-pick" style="margin-top:10px">🖼️ Or use a photo<input type="file" accept="image/*" id="sAvImg"></div>
    ${S.avatarImg?`<button class="btn w sm" id="sAvClr">Remove photo</button>`:''}
    <label class="f">Money in per month (₹) — salary, pocket money, anything</label><input class="inp" id="sInc" type="number" inputmode="decimal" min="0" value="${S.income||''}" placeholder="0">
    <p class="mini">Used for GIVE % and Frugality. Never shared. Leave 0 and we'll use what you spend instead.</p>
    <label class="f">Month starts on day</label><input class="inp" id="sMs" type="number" min="1" max="28" value="${S.monthStart}">
    <p class="mini">Set it to your salary day so "this month" matches your paycheck.</p>
    <button class="btn l" id="sSave">💾 Save</button></div>
  <div class="card tr"><h2>Daily reminder ⏰</h2>
    <label class="f">Remind me at</label><input class="inp" type="time" id="sRem" value="${S.remind}">
    <a class="btn p" id="calA" href="${calLink()}" target="_blank" rel="noopener noreferrer">📅 Add daily reminder to Google Calendar</a>
    <button class="btn v" id="sNotif">🔔 App notifications</button>
    <p class="mini">The calendar one is the reliable one. Your + button also turns red and angry if you haven't logged by then.</p></div>
  <div class="card tl"><h2>Your data 🛟</h2><p class="mini" style="margin-top:-4px">Everything lives only on this phone. ${(()=>{const b=backupInfo();return S.lastBackup?'Last backup: '+(b.days===0?'today ✅':b.days+' days ago'+(b.days>=7?' 😬':'')):'Never backed up 😬'})()} · The app reminds you weekly.</p>
    <button class="btn c" id="sCsv">📊 Export spreadsheet (CSV)</button>
    <button class="btn w" id="sBk">💾 Save backup</button>
    <div class="photo-pick" style="margin-top:12px">♻️ Restore backup<input type="file" accept=".json,application/json" id="sRs"></div>
    <button class="btn r" id="sWipe">💣 Delete everything</button></div>
  <div class="card tr"><h2>Privacy & safety 🔐</h2>
    <p class="mini" style="margin-top:-4px">No bank link · no server · no account · no tracking. Data stays on this phone. ${S.agreed?'You accepted v'+esc(S.agreed.split('|')[0])+' on '+esc(S.agreed.split('|')[1]||'')+'.':''}</p>
    <button class="btn w" onclick="openLegal()">📜 Read Privacy Policy & Terms</button>
    <p class="mini">Test it: turn on aeroplane mode. The app still works, because there is nothing to connect to.</p></div>
  ${DONATE.upi?`<button class="btn g" onclick="go('support')">☕ Support the creator</button>`:''}
  <p class="mini" style="text-align:center">Aura Wallet v1.2 · built different 🗿</p>`;
  $$('[data-av]').forEach(b=>b.onclick=async()=>{S.avatar=b.dataset.av;S.avatarImg='';await saveS();render()});
  $('#sAvImg').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{S.avatarImg=await squareDataURL(f);await saveS();render();toast('Looking sharp. 😎')}catch(err){toast('Image failed 😕','warn')}};
  const clr=$('#sAvClr');if(clr)clr.onclick=async()=>{S.avatarImg='';await saveS();render()};
  $('#sSave').onclick=async()=>{const inc=$('#sInc').value===''?0:money($('#sInc').value);if(inc===null){toast('Money in must be a number ≥ 0','warn');return}
    const ms=parseInt($('#sMs').value);if(!(ms>=1&&ms<=28)){toast('Month start: pick 1 to 28 📅','warn');return}
    const nm=$('#sName').value.trim();if(!nm){toast('You need a name. Even NPCs have names. 🗿','warn');return}
    S.name=nm.slice(0,24);S.income=inc;S.monthStart=ms;await saveS();toast('Saved ✅');afterChange()};
  $('#sRem').onchange=async e=>{if(/^\d{2}:\d{2}$/.test(e.target.value)){S.remind=e.target.value;await saveS();$('#calA').href=calLink();toast('Reminder time saved ⏰')}};
  $('#sNotif').onclick=async()=>{if(!('Notification' in window)){toast('Not supported here. Use calendar. 📅','warn');return}const p=await Notification.requestPermission();if(p!=='granted'){toast('Denied. Calendar it is. 📅','warn');return}
    try{const reg=await navigator.serviceWorker.ready;if('periodicSync' in reg){try{await reg.periodicSync.register('aura-remind',{minInterval:6*36e5})}catch(e){}}reg.showNotification('Aura Wallet 🗿',{body:'Notifications on. I will judge you daily.',icon:'icon-192.png'})}catch(e){}};
  $('#sCsv').onclick=exportCSV;$('#sBk').onclick=backup;$('#sRs').onchange=e=>restore(e.target.files[0]);
  $('#sWipe').onclick=async()=>{if(await ask('Delete EVERYTHING? 💣','All entries, budgets, badges, squad. Gone. Back up first. Or don\'t. I\'m a button, not a cop.','Nuke it','No no no')){await dbClear('entries');await dbClear('kv');E=[];S=DEF();lastLevel=null;go('home');onboard()}};
}
function exportCSV(){
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[['Date','Day','Type','Category / Cause','Note','Amount (INR)','Photo']];
  [...E].sort((a,b)=>a.date===b.date?a.time-b.time:(a.date<b.date?-1:1)).forEach(e=>rows.push([e.date,WD[pd(e.date).getDay()],e.type==='give'?'Give':e.type==='spend'?'Spend':'Zero-spend day',e.type==='spend'?catOf(e.cat).name:e.type==='give'?e.cause:'',e.note||'',e.amt||0,e.photo?'Yes':'No']));
  const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'});
  shareFile(blob,`AuraWallet_${today()}.csv`,'Aura Wallet export');
}
async function backup(){loading(true);try{const out=[];for(const e of E){const o={...e};if(e.photo)o.photo=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(e.photo)});out.push(o)}
  const blob=new Blob([JSON.stringify({app:'aurawallet',v:1,at:new Date().toISOString(),settings:S,entries:out})],{type:'application/json'});loading(false);await shareFile(blob,`AuraWallet_backup_${today()}.json`,'Aura Wallet backup');S.lastBackup=today();S.backupSnooze='';await saveS();toast('Backed up. Send it to yourself on WhatsApp or Drive. Future you says thanks. 🛟');render()}catch(e){loading(false);toast('Backup failed 😬','warn')}}
async function restore(file){if(!file)return;try{const j=JSON.parse(await file.text());if(j.app!=='aurawallet'||!Array.isArray(j.entries))throw new Error('Not an Aura Wallet backup 🤨');
  if(!(await ask('Restore? ♻️',`${j.entries.length} entries + settings will replace what's here.`,'Restore','Cancel')))return;loading(true);
  const ns=sanitizeSettings(j.settings);const prev=S;ns.agreed=prev.agreed||'';S=ns;const good=[];
  for(const r of j.entries){if(r&&typeof r.photo==='string'&&r.photo.startsWith('data:image/')){try{r.photo=await (await fetch(r.photo)).blob()}catch(e){delete r.photo}}else if(r)delete r.photo;const e=sanitizeEntry(r);if(e)good.push(e)}
  await dbClear('entries');for(const e of good)await dbPut('entries',e);S.setup=true;await saveS();E=good;loading(false);toast(`Restored ${good.length} entries ✅`);lastLevel=null;go('home')}
  catch(e){loading(false);toast(e.message||'Restore failed','warn')}}

/* =================== SUPPORT THE CREATOR =================== */
let SUP={amt:49};
function upiLink(amt){const q=new URLSearchParams({pa:DONATE.upi,pn:DONATE.name||'Aura Wallet',cu:'INR',tn:DONATE.note});if(amt)q.set('am',Number(amt).toFixed(2));return 'upi://pay?'+q.toString().replace(/\+/g,'%20')}
function renderSupport(){
  if(!DONATE.upi){cur='home';return renderHome(calc())}
  const tiers=[[20,'☕ Chai'],[49,'🥟 Samosa'],[99,'🍕 Pizza slice'],[199,'🗿 Moai food']];
  $('#view').innerHTML=`<div class="secthead"><h2>Support ☕</h2><button class="chip" onclick="go('settings')">← Back</button></div>
  <div class="card tl" style="text-align:center"><div style="font-size:70px;animation:wob 2s infinite">🗿☕</div>
    <h2>Buy the dev a chai</h2><p>Aura Wallet is free. No ads. No data selling. One guy made this.</p>
    <p class="mini">Totally optional. Pay any amount. The app works the same either way.</p></div>
  <div class="card tr"><label class="f" style="margin-top:0">Pick an amount</label>
    <div class="chips">${tiers.map(([a,n])=>`<button class="chip ${SUP.amt==a?'on':''}" data-sa="${a}" style="${SUP.amt==a?'background:var(--gold)':''}">${n} ₹${a}</button>`).join('')}</div>
    <label class="f">Or any amount (₹)</label><input class="inp amt-inp" id="supAmt" type="number" inputmode="decimal" min="1" value="${SUP.amt||''}" placeholder="0">
    <a class="btn mega g" id="supPay" href="#">PAY WITH UPI 🫶</a>
    <p class="mini" style="text-align:center">Opens GPay / PhonePe / Paytm. You confirm the payment there. Nothing is charged from inside this app.</p>
    <label class="f">Button didn't open anything?</label>
    <button class="btn w sm" id="supCopy" style="margin-top:0">📋 Copy UPI ID, then paste it in your UPI app</button></div>
  <p class="mini" style="text-align:center">Honest note: this is a tip for the app maker. It is not charity, so it does not count toward your 🫶 GIVE score.</p>`;
  const inp=$('#supAmt'),pay=$('#supPay');
  const sync=()=>{const v=money(inp.value);SUP.amt=v&&v>=1&&v<=100000?v:null;pay.href=SUP.amt?upiLink(SUP.amt):'#'};sync();
  inp.oninput=sync;
  $$('[data-sa]').forEach(b=>b.onclick=()=>{SUP.amt=+b.dataset.sa;renderSupport()});
  pay.onclick=e=>{sync();if(!SUP.amt){e.preventDefault();inp.classList.add('bad');setTimeout(()=>inp.classList.remove('bad'),500);toast('Enter ₹1 to ₹1,00,000 🧮','warn');return}toast('Opening your UPI app... 🫶','gold')};
  $('#supCopy').onclick=()=>copyText(DONATE.upi);
}
/* =================== ONBOARDING =================== */
function onboard(){
  const pickSet=new Set(['food','travel','shopping','drinks','fun']);let av='🗿';
  const draw=()=>{modal(`<div style="text-align:center;font-size:72px;animation:wob 2s infinite">🗿</div><h2>Welcome to Aura Wallet</h2>
    <p class="mini">Track spends. Give back. Farm aura. Beat your friends at being a good human.</p>
    <label class="f">Your name</label><input class="inp" id="oName" maxlength="24" placeholder="Name">
    <label class="f">Pick an avatar</label><div class="emojis">${AVATARS.map(a=>`<button data-oav="${a}" class="${av===a?'on':''}">${a}</button>`).join('')}</div>
    <label class="f">Money in per month ₹ (optional)</label><input class="inp" id="oInc" type="number" inputmode="decimal" placeholder="salary / pocket money">
    <label class="f">Daily spend limit ₹ (optional)</label><input class="inp" id="oDay" type="number" inputmode="decimal" placeholder="e.g. 500">
    <label class="f">Pick categories (edit / add more later)</label>
    <div class="chips">${PRESETS.map(p=>`<button class="chip ${pickSet.has(p.id)?'on':''}" data-op="${p.id}" style="${pickSet.has(p.id)?'background:'+p.color:''}">${p.emoji} ${p.name}</button>`).join('')}</div>
    <label class="agree"><input type="checkbox" id="oAgree"><span>I have read and agree to the <a href="#" id="oLegal">Privacy Policy & Terms</a>. Short version: no bank link, no server, your data stays on this phone, nothing is collected. Not financial advice.</span></label>
    <button class="btn mega p" id="oGo">LET'S GOOO 🚀</button>`,true);
    $('#oLegal').onclick=e=>{e.preventDefault();openLegal()};
    const keepIn=()=>({n:$('#oName').value,i:$('#oInc').value,d:$('#oDay').value,a:$('#oAgree').checked});
    const restoreIn=v=>{$('#oName').value=v.n;$('#oInc').value=v.i;$('#oDay').value=v.d;$('#oAgree').checked=v.a};
    $$('[data-oav]').forEach(b=>b.onclick=()=>{const v=keepIn();av=b.dataset.oav;draw();restoreIn(v)});
    $$('[data-op]').forEach(b=>b.onclick=()=>{const v=keepIn();const k=b.dataset.op;pickSet.has(k)?pickSet.delete(k):pickSet.add(k);draw();restoreIn(v)});
    $('#oGo').onclick=async()=>{const nm=$('#oName').value.trim();if(!nm){$('#oName').classList.add('bad');toast('Name first. Even NPCs have names. 🗿','warn');return}
      if(!$('#oAgree').checked){toast('Tick the Privacy & Terms box first. Boring but important. 📜','warn');$('#oAgree').parentElement.classList.add('bad');return}
      S.agreed=LEGAL_VER+'|'+today();
      const inc=$('#oInc').value===''?0:money($('#oInc').value),day=$('#oDay').value===''?0:money($('#oDay').value);if(inc===null||day===null){toast('Numbers only, ≥ 0 🧮','warn');return}
      S.name=nm.slice(0,24);S.avatar=av;S.income=inc;S.overall.daily=day;
      S.cats=[...PRESETS.filter(p=>pickSet.has(p.id)).map(p=>({...p,budget:0,sys:false})),{...OTHER}];S.setup=true;await saveS();
      closeModal();boom('🗿');toast(`Welcome, ${S.name}. Aura farming begins.`);afterChange();
      setTimeout(()=>modal(`<h2>Pro tips 🗿</h2><p>🫶 Log every give. It's the score that matters.</p><p>📊 Set category budgets in the <b>Budgets</b> tab.</p><p>⏰ Turn on the daily reminder in ⚙️.</p><p>🏆 Share your code in <b>Squad</b>.</p><button class="btn g" onclick="closeModal()">Got it</button>`),1200)};
  };draw();
}

/* =================== BOOT =================== */
(async()=>{
  try{await load()}catch(e){console.error(e);S=DEF();E=[];toast('Storage blocked. Data may not save. 😬','warn')}
  render();
  if(!S.setup)onboard();
  else if(String(S.agreed||'').split('|')[0]!==LEGAL_VER){modal(`<div style="text-align:center;font-size:64px">📜</div><h2>Privacy & Terms</h2><p>Quick one. Short version: no bank link, no server, your data stays on this phone, nothing is collected. Not financial advice.</p><button class="btn w" id="rLegal">Read the full text</button><button class="btn mega l" id="rAgree">I AGREE</button><p class="mini">Don't agree? Close the app. You can delete your data from the browser's site settings.</p>`,true);
    $('#rLegal').onclick=openLegal;$('#rAgree').onclick=async()=>{S.agreed=LEGAL_VER+'|'+today();await saveS();closeModal();toast('Noted. Carry on farming aura. 🗿')}}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  let lastDay=today();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!openCount()){render();lastDay=today()}});
  setInterval(()=>{if(today()!==lastDay&&!openCount()){lastDay=today();render()}},60000);
})();
</script>
